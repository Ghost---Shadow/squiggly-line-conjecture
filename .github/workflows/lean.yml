name: Lean proofs

# Builds the Lean project, so that "machine-checked" can be verified by anyone.
on:
  push:
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: No sorry in the sources
        run: "! grep -rn 'sorry' lean/SquigglyLine lean/SquigglyLine.lean"
